org: graciamendoza
service: chinawok-api-pedidos

provider:
  name: aws
  runtime: python3.13  # Versión de Python que usarás
  timeout: 20  # Tiempo de espera por defecto para las funciones
  iam:
    role: arn:aws:iam::645888963933:role/LabRole  # Rol IAM con permisos necesarios para Lambda y DynamoDB

 
functions:
  # Producto CRUD Functions
  crear_producto:
    handler: src.productos.CrearProducto.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /productos/crear
          method: post
          cors: true
          integration: lambda

  obtener_producto:
    handler: src.productos.BuscarProducto.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /productos/{local_id}/{nombre}
          method: get
          cors: true
          integration: lambda

  actualizar_producto:
    handler: src.productos.ModificarProducto.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /productos/{local_id}/{nombre}
          method: put
          cors: true
          integration: lambda

  eliminar_producto:
    handler: src.productos.EliminarProducto.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /productos/{local_id}/{nombre}
          method: delete
          cors: true
          integration: lambda

  listar_productos:
    handler: src.productos.ListarProductos.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /productos/listar
          method: get
          cors: true
          integration: lambda

  # Pedidos CRUD Functions
  crear_pedido:
    handler: src.pedidos.CrearPedido.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /pedidos/crear
          method: post
          cors: true
          integration: lambda

  obtener_pedido:
    handler: src.pedidos.BuscarPedido.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /pedidos/{local_id}/{pedido_id}
          method: get
          cors: true
          integration: lambda

  actualizar_pedido:
    handler: src.pedidos.ModificarPedido.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /pedidos/{local_id}/id/{pedido_id}
          method: put
          cors: true
          integration: lambda

  eliminar_pedido:
    handler: src.pedidos.EliminarPedido.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /pedidos/{local_id}/{pedido_id}
          method: delete
          cors: true
          integration: lambda

  listar_pedidos:
    handler: src.pedidos.ListarPedidos.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /pedidos/listar
          method: get
          cors: true
          integration: lambda

  # Ofertas CRUD Functions
  crear_oferta:
    handler: src.ofertas.CrearOferta.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /ofertas/crear
          method: post
          cors: true
          integration: lambda

  obtener_oferta:
    handler: src.ofertas.BuscarOferta.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /ofertas/{local_id}/{oferta_id}
          method: get
          cors: true
          integration: lambda

  actualizar_oferta:
    handler: src.ofertas.ModificarOferta.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /ofertas/{local_id}/{oferta_id}
          method: put
          cors: true
          integration: lambda

  eliminar_oferta:
    handler: src.ofertas.EliminarOferta.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /ofertas/{local_id}/{oferta_id}
          method: delete
          cors: true
          integration: lambda

  listar_ofertas:
    handler: src.ofertas.ListarOfertas.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /ofertas/listar
          method: get
          cors: true
          integration: lambda

  # Combos CRUD Functions
  crear_combo:
    handler: src.combos.CrearCombo.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /combos/crear
          method: post
          cors: true
          integration: lambda

  obtener_combo:
    handler: src.combos.BuscarCombo.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /combos/{local_id}/{combo_id}
          method: get
          cors: true
          integration: lambda

  actualizar_combo:
    handler: src.combos.ModificarCombo.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /combos/{local_id}/{combo_id}
          method: put
          cors: true
          integration: lambda

  eliminar_combo:
    handler: src.combos.EliminarCombo.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /combos/{local_id}/{combo_id}
          method: delete
          cors: true
          integration: lambda

  listar_combos:
    handler: src.combos.ListarCombos.lambda_handler
    memorySize: 512
    events:
      - http:
          path: /combos/listar
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    ProductosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ChinaWok-Productos
        AttributeDefinitions:
          - AttributeName: producto_id
            AttributeType: S
        KeySchema:
          - AttributeName: producto_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    PedidosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ChinaWok-Pedidos
        AttributeDefinitions:
          - AttributeName: pedido_id
            AttributeType: S
        KeySchema:
          - AttributeName: pedido_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    OfertasTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ChinaWok-Ofertas
        AttributeDefinitions:
          - AttributeName: oferta_id
            AttributeType: S
        KeySchema:
          - AttributeName: oferta_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    CombosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ChinaWok-Combos
        AttributeDefinitions:
          - AttributeName: combo_id
            AttributeType: S
        KeySchema:
          - AttributeName: combo_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
